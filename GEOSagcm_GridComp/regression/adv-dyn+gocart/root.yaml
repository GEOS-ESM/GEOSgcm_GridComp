---
mapl:

  setServices:
    sharedObj: libconfigurable_gridcomp

  states: {}

  geometry:
    kind: from_child
    provider: DYN

  children:
    DataForGOCART2G:
      dso: libconfigurable_gridcomp.so
      setservices: setservices_
      config_file: data-for-gocart2g.yaml
      run_phases:
        - run

    GOCART2G:
      dso: libGOCART2G_GridComp.so
      setservices: gocart2g_setservices_
      config_file: GOCART2G_GridComp.yaml
      run_phases:
        - Run1
        - Run2

    DataMoist:
      config_file: data-moist.yaml
      dso: libconfigurable_gridcomp

    DataPhisVarflt:
      config_file: data-phis-varflt.yaml
      dso: libconfigurable_gridcomp

    DataAna:
      config_file: data-ana.yaml
      dso: libconfigurable_gridcomp

    DYN:
      config_file: dyn.yaml
      dso: libFVdycoreCubed_GridComp
      setservices: fvdycorecubed_setservices_

    ADV:
      config_file: adv.yaml
      dso: libFVdycoreCubed_GridComp
      setservices: advcore_setservices_

  connections:
    # GOCART2G's DU, SS and SU subscribe to TRADV from inside GOCART2G
    - src_name: TRADV
      dst_name: TRADV
      src_comp: ADV
      dst_comp: GOCART2G

    - src_name: TRADV
      dst_name: TRADV
      src_comp: DYN
      dst_comp: DataMoist

    - src_name: TRADV
      dst_name: TRADV
      src_comp: ADV
      dst_comp: DataMoist

    - src_name: PHIS
      src_intent: internal
      src_comp: DataPhisVarflt
      dst_name: PHIS
      dst_comp: DYN

    - src_name: VARFLT
      src_intent: internal
      src_comp: DataPhisVarflt
      dst_name: VARFLT
      dst_comp: DYN

    - src_name: MFX
      dst_name: MFX
      src_comp: DYN
      dst_comp: ADV

    - src_name: MFY
      dst_name: MFY
      src_comp: DYN
      dst_comp: ADV

    - src_name: CX
