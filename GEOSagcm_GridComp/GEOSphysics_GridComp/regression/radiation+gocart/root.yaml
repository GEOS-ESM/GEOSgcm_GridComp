---
mapl:
  setServices:
    sharedObj: libconfigurable_gridcomp

  geometry:
    esmf_geom:
      class: CubedSphere
      im_world: 12
    vertical_grid:
      grid_type: model
      fields: {pressure: PLE}
      num_levels: 181

  children:
    DataForGOCART2G:
      dso: libconfigurable_gridcomp.so
      setservices: setservices_
      config_file: data-for-gocart2g.yaml
      run_phases:
        - run

    GOCART2G:
      dso: libGOCART2G_GridComp.so
      setservices: gocart2g_setservices_
      config_file: GOCART2G_GridComp.yaml
      run_phases:
        - Run1
        - Run2

    DataForSolar:
      dso: libconfigurable_gridcomp.so
      setservices: setservices_
      config_file: data-for-solar.yaml

    SOLAR:
      dso: libGEOSradiation_GridComp.so
      setservices: solar_setservices_
      config_file: solar.yaml

    DataForIrrad:
      dso: libconfigurable_gridcomp.so
      setservices: setservices_
      config_file: data-for-irrad.yaml

    IRRAD:
      dso: libGEOSradiation_GridComp.so
      setservices: irrad_setservices_
      config_file: irrad.yaml

  connections:
