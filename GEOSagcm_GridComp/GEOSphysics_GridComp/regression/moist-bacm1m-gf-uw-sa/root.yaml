---
mapl:

  setServices:
    sharedObj: libconfigurable_gridcomp
    userRoutine: setservices_

  geometry:
    esmf_geom:
      class: CubedSphere
      im_world: 12
    vertical_grid:
      grid_type: model
      fields: {pressure: PLE}
      num_levels: 72   # BACM_1M's production setup (gcm_setup:356-359); the GFDL_1M cases use 181

  children:
    DataForMoist:
      dso: libconfigurable_gridcomp.so
      setservices: setservices_
      config_file: data-for-moist.yaml

    MOIST:
      dso: libGEOSmoist_GridComp.so
      setservices: moist_setservices_
      config_file: moist.yaml

    FakeGOCART:
      dso: libFakeGOCART_GridComp.so
      setservices: fakegocart_setservices_
      config_file: fake-gocart.yaml

    DataTracers:
      dso: libconfigurable_gridcomp.so
      setservices: setservices_
      config_file: data-tracers.yaml

  # MOIST's TRADV, TRDIFF, TRCHEM and TRANA subscriptions are left unconnected
  # (mapl3-porting-notes.md, step 10).
  connections:
    - src_name: PLE
      src_comp: DataForMoist
      src_intent: internal
      dst_name: PLE
      dst_comp: MOIST
