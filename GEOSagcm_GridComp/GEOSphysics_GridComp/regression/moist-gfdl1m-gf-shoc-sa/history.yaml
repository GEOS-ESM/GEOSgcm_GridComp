# Activates (requests) the MOIST exports this case writes: GFDL_1M + GF (no UW) with
# moist.yaml's settings. A collection that never writes (start after the cap stop)
# still connects its fields, so only these exports are allocated. Without
# activate_all_exports, the exports this configuration never writes are not
# allocated: MAPL3 leaves an allocated export without a fill value uninitialized,
# where MAPL2 zeroed it. List: moist-gfdl1m-gf-uw-sa's sentinel-run list minus the
# 22 exports that only UW_Run writes (GEOS_UW_InterfaceMod.F90). Confirmed by a
# sentinel run for this configuration (2026-11-05): every listed export is written,
# every written export is listed except REFL10CM_MAX, CUFRC_SC (an always-active
# ADD2EXPORT internal) and the MTR bundle.
# REFL10CM_MAX is left out: it is computed only when DBZ_RunAlarm rings, and the
# MAPL2 capture holds a value from an earlier step (mapl3-porting-notes.md, first
# cmpchk.py result). No geom/vertical_grid: native grid.
mapl:
  setServices:
    sharedObj: libMAPL.history

active_collections:
  - moist

time_specs:
  never: &never
    frequency: PT20M
    start: "3000-01-01T00:00:00"

collections:
  moist:
    template: "%c.%y4%m2%d2_%h2%n2z.nc4"
    time_spec: *never
    var_list:
