# Activates (requests) the TURBULENCE exports the MAPL2 run had allocated
# (requested by History or by other components, or ALLOC'd): those in the MAPL2
# export capture, less the TRI bundle members and the fields that are internals
# in MAPL3 (always active), and less the ones that are not requested in this
# configuration: DU, EDMF_DQRDT, EDMF_DQSDT, ISOTROPY, SL2, SL3, W2, W3 (MAPL3 would leave a
# requested export that is never written uninitialized, MAPL2 zeroed it).
# Requesting a field changes what MAPL2's ALLOC= and associated() tests do, so
# this list reproduces the MAPL2 run. A collection that never writes (start
# after the cap stop) still connects its fields. No geom/vertical_grid: native
# grid.
mapl:
  setServices:
    sharedObj: libMAPL.history

active_collections:
  - turbulence

time_specs:
  never: &never
    frequency: PT20M
    start: "3000-01-01T00:00:00"

collections:
  turbulence:
    template: "%c.%y4%m2%d2_%h2%n2z.nc4"
    time_spec: *never
    var_list:
      DBUOY:       {source: TURBULENCE.DBUOY}
      DPDTTRB:     {source: TURBULENCE.DPDTTRB}
      EKH:         {source: TURBULENCE.EKH}
      EKM:         {source: TURBULENCE.EKM}
      INTDIS:      {source: TURBULENCE.INTDIS}
      KH:          {source: TURBULENCE.KH}
      KHLS:        {source: TURBULENCE.KHLS}
      KHRAD:       {source: TURBULENCE.KHRAD}
      KHSFC:       {source: TURBULENCE.KHSFC}
      KM:          {source: TURBULENCE.KM}
      KMLS:        {source: TURBULENCE.KMLS}
      KPBL:        {source: TURBULENCE.KPBL}
      KPBL_SC:     {source: TURBULENCE.KPBL_SC}
      LWCRT:       {source: TURBULENCE.LWCRT}
      PPBL:        {source: TURBULENCE.PPBL}
      QAFDIFFUSE:  {source: TURBULENCE.QAFDIFFUSE}
      QDFL:        {source: TURBULENCE.QDFL}
      QFLX:        {source: TURBULENCE.QFLX}
      QT:          {source: TURBULENCE.QT}
      RI:          {source: TURBULENCE.RI}
      SAFDIFFUSE:  {source: TURBULENCE.SAFDIFFUSE}
      SAFUPDATE:   {source: TURBULENCE.SAFUPDATE}
      SDFL:        {source: TURBULENCE.SDFL}
      SFLX:        {source: TURBULENCE.SFLX}
      SL:          {source: TURBULENCE.SL}
      SLQT:        {source: TURBULENCE.SLQT}
      SRFDIS:      {source: TURBULENCE.SRFDIS}
      TKE:         {source: TURBULENCE.TKE}
      TOPDIS:      {source: TURBULENCE.TOPDIS}
      UAFDIFFUSE:  {source: TURBULENCE.UAFDIFFUSE}
      UDFL:        {source: TURBULENCE.UDFL}
      UFLX:        {source: TURBULENCE.UFLX}
      VAFDIFFUSE:  {source: TURBULENCE.VAFDIFFUSE}
      VDFL:        {source: TURBULENCE.VDFL}
      VFLX:        {source: TURBULENCE.VFLX}
      WERAD:       {source: TURBULENCE.WERAD}
      WQT:         {source: TURBULENCE.WQT}
      WSL:         {source: TURBULENCE.WSL}
      ZCLD:        {source: TURBULENCE.ZCLD}
      ZRADBS:      {source: TURBULENCE.ZRADBS}
      ZRADML:      {source: TURBULENCE.ZRADML}
      ZSML:        {source: TURBULENCE.ZSML}
