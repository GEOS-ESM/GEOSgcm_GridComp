mapl:

  setServices:
    sharedObj: libconfigurable_gridcomp

  states: {}

  geometry:
    esmf_geom:
      class: CubedSphere
      im_world: 12
      nx_face: 1
      ny_face: 1
    vertical_grid:
      grid_type: model
      fields: {pressure: PLE}
      num_levels: 181

  children:
    GWD:
      dso: libGEOSgwd_GridComp.so
      config_file: gwd.yaml
      setservices: gwd_setservices_

    DataGwdImports:
      dso: libconfigurable_gridcomp
      config_file: data-gwd-imports.yaml
      setservices: setservices_

  connections:
    - src_name: PLE
      src_comp: DataGwdImports
      dst_name: PLE
      dst_comp: GWD

    - src_name: T
      src_comp: DataGwdImports
      dst_name: T
      dst_comp: GWD

    - src_name: Q
      src_comp: DataGwdImports
      dst_name: Q
      dst_comp: GWD

    - src_name: U
      src_comp: DataGwdImports
      dst_name: U
      dst_comp: GWD

    - src_name: V
      src_comp: DataGwdImports
      dst_name: V
      dst_comp: GWD

    - src_name: PHIS
      src_comp: DataGwdImports
      dst_name: PHIS
      dst_comp: GWD

    - src_name: SGH
      src_comp: DataGwdImports
      dst_name: SGH
      dst_comp: GWD

    - src_name: VARFLT
      src_comp: DataGwdImports
      dst_name: VARFLT
      dst_comp: GWD

    - src_name: PREF
      src_comp: DataGwdImports
      dst_name: PREF
      dst_comp: GWD

    - src_name: AREA
      src_comp: DataGwdImports
      dst_name: AREA
      dst_comp: GWD

    - src_name: HT_dc
      src_comp: DataGwdImports
      dst_name: HT_dc
      dst_comp: GWD

    - src_name: HT_mi
      src_comp: DataGwdImports
      dst_name: HT_mi
      dst_comp: GWD

    - src_name: WSPD_STABLE300M
      src_comp: DataGwdImports
      dst_name: WSPD_STABLE300M
      dst_comp: GWD

    - src_name: CNV_FRC
      src_comp: DataGwdImports
      dst_name: CNV_FRC
      dst_comp: GWD
